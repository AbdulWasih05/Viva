# Render Blueprint: one-click deploy of Viva's hosted mode.
#
# One web service runs the Next.js app. It calls hosted Gemma (Google AI Studio by default),
# so no GPU or private model service is needed and the free plan is enough.
# Render asks for the two secrets below when you create the Blueprint.
services:
  - type: web
    name: viva
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    # Ping this every 5 minutes (UptimeRobot or a cron job) to stop the free instance from sleeping.
    healthCheckPath: /api/health
    # Deploys are started by hand, so a push to the repo never surprises a running demo.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      # Hosted mode: GitHub URLs only, no folders, no memory, nothing stored.
      - key: LOCAL_MODE
        value: "false"
      - key: LLM_PROVIDER
        value: hosted
      - key: HOSTED_MODEL
        value: gemma-4-26b-a4b-it
      # Your Google AI Studio key (aistudio.google.com). Free; shared by all visitors of your instance.
      - key: HOSTED_API_KEY
        sync: false
      # Optional but recommended: a GitHub token with no scopes raises the API limit from 60 to 5,000 requests per hour.
      - key: GITHUB_TOKEN
        sync: false
      # Optional: a Sentry DSN turns on tracing of interview turns (metadata only).
      - key: SENTRY_DSN
        sync: false
